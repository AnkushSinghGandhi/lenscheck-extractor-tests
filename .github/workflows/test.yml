name: extractor tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout test repo
        uses: actions/checkout@v4

      - name: checkout prism (extractor source)
        uses: actions/checkout@v4
        with:
          repository: AnkushSinghGandhi/lenscheck-semantic-reviewer
          path: _prism

      - name: copy extractor
        run: cp -r _prism/extractor extractor

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install pytest
        run: pip install pytest

      - name: run tests
        run: pytest
